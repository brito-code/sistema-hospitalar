# Datasource isolado: H2 em arquivo (desenvolvimento).
spring.datasource.url=jdbc:h2:file:./data/hospital
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Console web do H2 para olhar as tabelas: http://localhost:8080/h2-console
# (JDBC URL acima, usuario sa, senha vazia). So existe neste perfil de desenvolvimento.
spring.h2.console.enabled=true

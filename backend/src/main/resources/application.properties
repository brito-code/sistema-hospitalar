spring.application.name=sistema-hospitalar
# Perfil do banco. Para PostgreSQL, crie application-postgres.properties e use: spring.profiles.active=postgres
spring.profiles.active=h2

# JPA: o Hibernate cria/atualiza as tabelas a partir das entidades. open-in-view desligado:
# a resposta e montada dentro do service, nao depende de sessao aberta na camada web.
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=update

# Mensagens de validacao em portugues, independente do idioma do navegador.
spring.web.locale=pt_BR
spring.web.locale-resolver=fixed

# Origens que podem chamar a API pelo navegador (front-end React/Vite), separadas por virgula.
hospital.cors.origens=http://localhost:5173,http://127.0.0.1:5173
